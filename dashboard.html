<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LLM Firewall — Security Dashboard</title>
<style>
  :root {
    --bg: #0b0d0f;
    --panel: #12161a;
    --panel2: #171c21;
    --border: #232a30;
    --text: #d7dde2;
    --muted: #6b7680;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    --low: #3fb950;
    --medium: #d4a72c;
    --high: #f85149;
    --accent: #1f6feb;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    margin: 0;
    padding: 32px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
  }
  .header h1 { font-size: 18px; margin: 0; letter-spacing: 1px; }
  .header .eyebrow { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
  .config-row { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); }
  .config-row input {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 5px 8px; font-family: var(--mono); font-size: 11px; border-radius: 4px; width: 220px;
  }
  .config-row button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 5px 10px; font-family: var(--mono); font-size: 11px; border-radius: 4px; cursor: pointer;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    max-width: 1200px;
    margin: 0 auto 20px auto;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
  }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; }
  .stat-value.allow { color: var(--low); }
  .stat-value.warn { color: var(--medium); }
  .stat-value.block { color: var(--high); }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    max-width: 1200px;
    margin: 0 auto 20px auto;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .panel h2 { font-size: 13px; margin: 0 0 14px 0; color: var(--text); letter-spacing: .5px; }

  .attack-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12px; }
  .attack-name { width: 220px; color: var(--muted); }
  .attack-bar-track { flex: 1; background: #1c2127; height: 8px; border-radius: 4px; overflow: hidden; }
  .attack-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .attack-count { width: 30px; text-align: right; }
  .empty { color: var(--muted); font-size: 12px; font-style: italic; }

  .threshold-editor { display: flex; flex-direction: column; gap: 10px; }
  .threshold-line { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .threshold-line .lvl { width: 70px; font-weight: 700; }
  .threshold-line.LOW .lvl { color: var(--low); }
  .threshold-line.MEDIUM .lvl { color: var(--medium); }
  .threshold-line.HIGH .lvl { color: var(--high); }
  .threshold-line input {
    width: 60px; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); padding: 5px 8px; font-family: var(--mono); font-size: 12px; border-radius: 4px;
  }
  .save-btn {
    align-self: flex-start; margin-top: 6px;
    background: var(--accent); color: white; border: none;
    padding: 8px 16px; font-family: var(--mono); font-size: 12px; font-weight: 600;
    border-radius: 5px; cursor: pointer;
  }
  .save-btn:hover { background: #2b7ffc; }
  .save-status { font-size: 11px; color: var(--muted); margin-left: 8px; }

  table { width: 100%; border-collapse: collapse; max-width: 1200px; margin: 0 auto; }
  .panel.full { max-width: 1200px; margin: 0 auto 20px auto; }
  th {
    text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  td { padding: 9px 10px; font-size: 12px; border-bottom: 1px solid var(--border); }
  .risk-pill {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 3px; letter-spacing: .5px;
  }
  .risk-LOW, .action-ALLOW { background: rgba(63,185,80,.15); color: var(--low); }
  .risk-MEDIUM, .action-WARN { background: rgba(212,167,44,.15); color: var(--medium); }
  .risk-HIGH, .action-BLOCK { background: rgba(248,81,73,.15); color: var(--high); }
  .review-btns { display: flex; gap: 6px; }
  .review-btns button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    padding: 3px 8px; font-size: 10px; border-radius: 3px; cursor: pointer; font-family: var(--mono);
  }
  .review-btns button.active-legit { background: rgba(63,185,80,.15); color: var(--low); border-color: transparent; }
  .review-btns button.active-attack { background: rgba(248,81,73,.15); color: var(--high); border-color: transparent; }
  .detections-cell { color: var(--muted); font-size: 11px; }
  .refresh-note { text-align: center; color: var(--muted); font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="eyebrow">LLM Security Dashboard</div>
    <h1 id="titleTotal">Loading...</h1>
  </div>
  <div class="config-row">
    <label>API</label>
    <input id="apiBase" value="http://localhost:8000">
    <label>Key</label>
    <input id="apiKey" value="" placeholder="X-API-Key (if set)" type="password">
    <button onclick="refreshAll()">Refresh</button>
  </div>
</div>

<div class="grid" id="statCards"></div>

<div class="row2">
  <div class="panel">
    <h2>Top Detected Attacks</h2>
    <div id="attackList"></div>
  </div>
  <div class="panel">
    <h2>Risk Thresholds (Admin)</h2>
    <div class="threshold-editor" id="thresholdEditor"></div>
    <button class="save-btn" onclick="saveThresholds()">Save Thresholds</button>
    <span class="save-status" id="saveStatus"></span>
  </div>
</div>

<div class="panel full">
  <h2>Recent Security Events</h2>
  <table>
    <thead>
      <tr>
        <th>Time</th><th>App</th><th>Prompt Preview</th><th>Score</th>
        <th>Risk</th><th>Action</th><th>Detections</th><th>Review</th>
      </tr>
    </thead>
    <tbody id="logsBody"></tbody>
  </table>
  <div class="refresh-note">Showing most recent 50 events. Click Refresh to reload.</div>
</div>

<script>
function apiBase() { return document.getElementById('apiBase').value.replace(/\/$/, ''); }

function headers(extra = {}) {
  const key = document.getElementById('apiKey').value.trim();
  const h = { ...extra };
  if (key) {
    h['X-API-Key'] = key;
  }
  return h;
}

async function refreshAll() {
  await Promise.all([loadStats(), loadSettings(), loadLogs()]);
}

async function loadStats() {
  try {
    const res = await fetch(apiBase() + '/api/statistics', { headers: headers() });
    if (!res.ok) {
      if (res.status === 401) {
        document.getElementById('titleTotal').textContent = '401 Unauthorized — Set valid X-API-Key';
        document.getElementById('statCards').innerHTML = '';
        document.getElementById('attackList').innerHTML = '<div class="empty">Admin authentication required. Enter X-API-Key above.</div>';
        return;
      }
      throw new Error(`HTTP ${res.status}`);
    }
    const s = await res.json();
    document.getElementById('titleTotal').textContent = `${s.total_requests} total requests`;

    document.getElementById('statCards').innerHTML = `
      <div class="stat-card"><div class="stat-label">Total Requests</div><div class="stat-value">${s.total_requests}</div></div>
      <div class="stat-card"><div class="stat-label">Allowed</div><div class="stat-value allow">${s.allowed}</div></div>
      <div class="stat-card"><div class="stat-label">Warned</div><div class="stat-value warn">${s.warned}</div></div>
      <div class="stat-card"><div class="stat-label">Blocked</div><div class="stat-value block">${s.blocked}</div></div>
    `;

    const maxCount = Math.max(1, ...s.top_detected_attacks.map(a => a.count));
    const attackList = document.getElementById('attackList');
    if (s.top_detected_attacks.length === 0) {
      attackList.innerHTML = '<div class="empty">No attacks detected yet.</div>';
    } else {
      attackList.innerHTML = s.top_detected_attacks.map(a => `
        <div class="attack-row">
          <div class="attack-name">${a.category}</div>
          <div class="attack-bar-track"><div class="attack-bar-fill" style="width:${(a.count/maxCount)*100}%"></div></div>
          <div class="attack-count">${a.count}</div>
        </div>
      `).join('');
    }
  } catch (e) {
    document.getElementById('titleTotal').textContent = 'Could not reach API';
  }
}

async function loadSettings() {
  try {
    const res = await fetch(apiBase() + '/api/settings', { headers: headers() });
    if (!res.ok) return;
    const t = await res.json();
    const editor = document.getElementById('thresholdEditor');
    editor.innerHTML = ['LOW', 'MEDIUM', 'HIGH'].map(level => `
      <div class="threshold-line ${level}">
        <span class="lvl">${level}</span>
        <input type="number" id="${level}_low" value="${t[level][0]}" min="0" max="100"> –
        <input type="number" id="${level}_high" value="${t[level][1]}" min="0" max="100">
      </div>
    `).join('');
  } catch (e) { /* API unreachable; leave editor empty */ }
}

async function saveThresholds() {
  const status = document.getElementById('saveStatus');
  const payload = {};
  ['LOW', 'MEDIUM', 'HIGH'].forEach(level => {
    payload[level] = [
      parseInt(document.getElementById(`${level}_low`).value, 10),
      parseInt(document.getElementById(`${level}_high`).value, 10)
    ];
  });
  status.textContent = 'Saving...';
  try {
    const res = await fetch(apiBase() + '/api/settings', {
      method: 'PUT',
      headers: headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.status);
    status.textContent = 'Saved.';
    setTimeout(() => status.textContent = '', 2000);
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
}

async function loadLogs() {
  const tbody = document.getElementById('logsBody');
  try {
    const res = await fetch(apiBase() + '/api/logs?limit=50', { headers: headers() });
    if (!res.ok) {
      if (res.status === 401) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">401 Unauthorized — Enter valid X-API-Key above.</td></tr>';
        return;
      }
      throw new Error(`HTTP ${res.status}`);
    }
    const events = await res.json();
    if (events.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty">No events logged yet.</td></tr>';
      return;
    }
    tbody.innerHTML = events.map(e => {
      const time = new Date(e.timestamp * 1000).toLocaleTimeString();
      const detections = e.detections.length ? e.detections.join(', ') : '—';
      const legitActive = e.review_label === 'legitimate' ? 'active-legit' : '';
      const attackActive = e.review_label === 'actual_attack' ? 'active-attack' : '';
      return `
        <tr>
          <td>${time}</td>
          <td>${e.application_id || '—'}</td>
          <td>${escapeHtml(e.prompt_preview || '')}</td>
          <td>${e.threat_score}</td>
          <td><span class="risk-pill risk-${e.risk_level}">${e.risk_level}</span></td>
          <td><span class="risk-pill action-${e.action}">${e.action}</span></td>
          <td class="detections-cell">${detections}</td>
          <td>
            <div class="review-btns">
              <button class="${legitActive}" onclick="review('${e.id}','legitimate')">Legit</button>
              <button class="${attackActive}" onclick="review('${e.id}','actual_attack')">Attack</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">Could not reach API.</td></tr>';
  }
}

async function review(eventId, label) {
  try {
    await fetch(`${apiBase()}/api/logs/${eventId}/review`, {
      method: 'PATCH',
      headers: headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ label })
    });
    loadLogs();
  } catch (e) { /* swallow — UI just won't update the pill */ }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

refreshAll();
</script>
</body>
</html>
